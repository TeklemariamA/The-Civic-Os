# ── Civic OS – production deployment ───────────────────────────────────────────
#
# Deploys the app at https://civic-os-opensourcism.cloud with automatic
# Let's Encrypt TLS certificates via certbot.
#
# ── FIRST-TIME SETUP (run once on the server) ──────────────────────────────────
#
# Step 1 – Point the domain's A record to this server's public IP and wait
#   for DNS propagation (usually a few minutes).
#
# Step 2 – Pull the latest image:
#   docker compose -f docker-compose.prod.yml pull
#
# Step 3 – Start the stack in HTTP-only mode (port 80 only, no SSL yet).
#   The built-in nginx/default.conf is used at this stage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Step 4 – Obtain the Let's Encrypt certificate via the webroot method:
#   docker compose -f docker-compose.prod.yml exec certbot certbot certonly \
#     --webroot --webroot-path /var/www/certbot \
#     -d civic-os-opensourcism.cloud \
#     -d www.civic-os-opensourcism.cloud \
#     --email your@email.com --agree-tos --no-eff-email
#
# Step 5 – Enable HTTPS by mounting nginx/prod.conf.
#   Edit this file and uncomment the two volume lines in the `frontend` service
#   that reference prod.conf and letsencrypt, then restart:
#   docker compose -f docker-compose.prod.yml up -d --force-recreate frontend
#
# ── SUBSEQUENT UPDATES ─────────────────────────────────────────────────────────
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --force-recreate frontend
#
# Certificates renew automatically (the certbot service polls every 12 hours).

services:
  frontend:
    image: ghcr.io/teklemariama/the-civic-os:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ── Uncomment AFTER running certbot for the first time (Step 4 above): ──
      # - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # - letsencrypt:/etc/letsencrypt:ro
      # ─────────────────────────────────────────────────────────────────────────
      # Shared web-root for ACME challenges (certbot writes; nginx reads).
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - certbot

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Check for renewal every 12 hours; certbot only contacts Let's Encrypt
    # when fewer than 30 days remain on the certificate.
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  letsencrypt:
  certbot-webroot:
