# ── Civic OS – production nginx configuration ──────────────────────────────────
#
# Handles both HTTP→HTTPS redirect and the HTTPS origin.
# Mount SSL certificates from Let's Encrypt before enabling the 443 block
# (see docker-compose.prod.yml for the full certbot workflow).

# ── HTTP – redirect to HTTPS / serve ACME challenges ───────────────────────────
server {
    listen 80;
    server_name civic-os-opensourcism.cloud www.civic-os-opensourcism.cloud;

    # Let's Encrypt / certbot renewal challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → force HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS – main application ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name civic-os-opensourcism.cloud www.civic-os-opensourcism.cloud;

    # SSL certificates provisioned by certbot (mounted as a Docker volume)
    ssl_certificate     /etc/letsencrypt/live/civic-os-opensourcism.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/civic-os-opensourcism.cloud/privkey.pem;

    # Modern TLS settings
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

    # ── Static asset caching ──────────────────────────────────────────────────
    # Vite appends a content hash to every asset filename so 1-year immutable
    # caching is safe and eliminates repeat downloads for returning visitors.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── PWA service worker – must never be cached ─────────────────────────────
    # Browsers must always fetch the latest sw.js so that app updates are
    # detected promptly.  Cache-Control: no-store prevents any caching.
    location = /sw.js {
        add_header Cache-Control "no-store";
        expires    off;
    }

    # ── PWA manifest – short cache so updates propagate quickly ──────────────
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
    }

    # favicon & other root-level public files
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── SPA routing ───────────────────────────────────────────────────────────
    # Any URL that isn't a real file falls back to index.html so React Router
    # can handle client-side navigation without 404s on direct-link access.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
