# ── Civic OS – production nginx configuration ──────────────────────────────────
#
# Activated automatically by the container entrypoint script
# (docker/entrypoint.d/10-select-ssl-config.sh) when the Let's Encrypt
# certificate is present at /etc/letsencrypt/live/<domain>/fullchain.pem.
#
# Do NOT load this file directly — it is stored as prod.conf.available inside
# the Docker image and copied over default.conf by the entrypoint at startup.

# ── HTTPS – main application ──────────────────────────────────────────────────
server {
    listen      443 ssl;
    http2       on;
    server_name civic-os-opensourcism.cloud www.civic-os-opensourcism.cloud;

    # Let's Encrypt certificate (mounted via letsencrypt Docker volume)
    ssl_certificate     /etc/letsencrypt/live/civic-os-opensourcism.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/civic-os-opensourcism.cloud/privkey.pem;

    # Modern SSL configuration (Mozilla Intermediate)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # HSTS – tells browsers to always use HTTPS for this domain
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    root  /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTP – redirect to HTTPS / serve ACME challenges ─────────────────────────
server {
    listen 80;
    server_name civic-os-opensourcism.cloud www.civic-os-opensourcism.cloud;

    # Let certbot serve ACME challenge tokens for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}
