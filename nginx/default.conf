# ── Civic OS – base nginx configuration (HTTP, all hostnames) ──────────────────
#
# This config is baked into the Docker image.  It serves the React SPA over
# plain HTTP so the container works out-of-the-box everywhere:
#   • local development  → docker compose up → http://localhost:8080
#   • behind a TLS-terminating load balancer / Cloudflare proxy
#   • production (docker-compose.prod.yml) overrides this with nginx/prod.conf
#     to add Let's Encrypt certificates and the HTTPS redirect.

server {
    listen 80;
    server_name _;          # accept any hostname (routing is done upstream)

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header X-XSS-Protection       "1; mode=block"                    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # ── Static asset caching ──────────────────────────────────────────────────
    # Vite appends a content hash to every asset filename, so 1-year immutable
    # caching is safe and eliminates repeat downloads for returning visitors.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── PWA service worker – must never be cached ─────────────────────────────
    # Browsers must always fetch the latest sw.js so that app updates are
    # detected promptly.  Cache-Control: no-store prevents any caching.
    location = /sw.js {
        add_header Cache-Control "no-store";
        expires    off;
    }

    # ── PWA manifest – short cache so updates propagate quickly ──────────────
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
    }

    # favicon and other public root files
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    # Forward /api/* requests to the FastAPI backend container.
    # In docker-compose the backend service is reachable at http://backend:8000.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── SPA routing ───────────────────────────────────────────────────────────
    # Any URL that does not match a real file falls back to index.html so that
    # React Router handles client-side navigation without 404s on direct links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Port 443 – graceful TLS rejection before certificates are provisioned ────
#
# When the production stack is started before Let's Encrypt certificates have
# been issued (or before prod.conf is activated), this server block ensures that
# HTTPS connections receive a proper TLS "unrecognised_name" alert rather than
# an abrupt TCP drop.  Without this block, Docker's port-proxy accepts the TCP
# connection on port 443 but nginx isn't listening, so the TLS handshake never
# completes — browsers display "ERR_SSL_PROTOCOL_ERROR".
#
# ssl_reject_handshake requires nginx ≥ 1.19.4 (the image is nginx:1.27-alpine).
# No ssl_certificate directive is needed; nginx sends the TLS alert immediately.
#
# Once prod.conf is activated by the entrypoint script (after certbot issues a
# certificate) this catch-all block is replaced by the real HTTPS server block.
server {
    listen      443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
