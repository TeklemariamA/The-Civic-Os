server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # SPA routing - serve index.html for all non-API routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ACME challenges for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # API proxy to backend.
    # resolver + variable proxy_pass defers DNS lookup to request time so that
    # `nginx -t` succeeds during Docker image builds where "backend" is not yet
    # resolvable. At runtime Docker's embedded DNS (127.0.0.11) resolves the
    # "backend" service name from the Docker Compose network.
    location /api/ {
        resolver      127.0.0.11 valid=10s ipv6=off;
        set           $api_upstream http://backend:8000;
        proxy_pass    $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTPS – self-signed certificate fallback ─────────────────────────────────
#
# Serves the app on port 443 using a self-signed certificate generated at
# Docker image build time (see the openssl RUN step in the Dockerfile).
#
# This ensures the TLS handshake completes immediately, preventing
# ERR_SSL_PROTOCOL_ERROR in all deployment scenarios:
#
#   • Direct browser access: browser shows "Your connection is not private"
#     (NET::ERR_CERT_AUTHORITY_INVALID); users can click "Advanced → Proceed".
#     This is acceptable during initial setup before Let's Encrypt is issued.
#
#   • Cloudflare "Full" SSL mode: works without any warnings — Cloudflare
#     connects to the origin over TLS and does NOT validate the origin cert.
#
#   • Cloudflare "Full (Strict)" SSL mode: requires a valid cert; issue the
#     Let's Encrypt certificate (Step 3 in DEPLOYMENT.md) for this mode.
#
# The container entrypoint (10-select-ssl-config.sh) replaces this file with
# prod.conf.available as soon as the Let's Encrypt certificate is detected,
# so nginx restarts with a fully valid, browser-trusted certificate.
server {
    listen      443 ssl;
    server_name _;

    # Self-signed certificate generated at image build time
    ssl_certificate     /etc/nginx/ssl/self-signed.crt;
    ssl_certificate_key /etc/nginx/ssl/self-signed.key;

    # Modern TLS settings
    ssl_protocols         TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root  /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend (same deferred-DNS approach as the HTTP block above)
    location /api/ {
        resolver      127.0.0.11 valid=10s ipv6=off;
        set           $api_upstream http://backend:8000;
        proxy_pass    $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
